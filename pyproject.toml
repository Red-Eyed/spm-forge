[project]
name = "spm-ocr"
version = "0.6.0"
description = "Train a SentencePiece tokenizer for multilingual OCR with preprocessing and validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" },
]
dependencies = [
    "pydantic>=2.7,<3",
    "sentencepiece==0.2.3.post1",
]

[tool.uv]
package = false
no-build-package = ["sentencepiece"]

[dependency-groups]
dev = [
    "cmake>=4.4.4",
    "pydantic-settings>=2,<3",
    "pyrefly>=1.4.1",
    "ruff>=0.17.5",
]

[tool.uv.sources]
sentencepiece = { index = "spm-forge-release" }

[[tool.uv.index]]
name = "spm-forge-release"
url = "https://github.com/Red-Eyed/sentencepiece/releases/download/spmforge-v0.2.3.post1/index.html"
format = "flat"
explicit = true
