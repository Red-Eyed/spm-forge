[project]
name = "spm-ocr"
version = "0.5.0"
description = "Train a SentencePiece tokenizer for multilingual OCR with preprocessing and validation"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "Vadym Stupakov", email = "vadim.stupakov@gmail.com" },
]
dependencies = [
    "pydantic>=2.7,<3",
    "sentencepiece==0.2.3",
]

[tool.uv]
package = false
no-build-package = ["sentencepiece"]

[dependency-groups]
dev = [
    "cmake>=4.4.4",
    "pydantic-settings>=2,<3",
    "pyrefly>=1.4.1",
    "ruff>=0.17.5",
]
